name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "scripts/check-package-manifests.mjs"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.18.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Restore Playwright browsers
        id: playwright-browsers
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install browser dependencies
        timeout-minutes: 10
        run: bunx --bun playwright install-deps chromium firefox webkit

      - name: Install browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: bunx --bun playwright install --only-shell chromium firefox webkit

      - name: Release checks
        run: bun run check:release

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: version packages"
          version-script: bun run version
          publish-script: bun run publish

  pages:
    name: Publish docs
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
