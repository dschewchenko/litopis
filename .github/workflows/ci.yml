name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Release checks
        run: bun run check:release:base

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Restore Playwright browsers
        if: matrix.project != 'chrome'
        id: playwright-browsers
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.project }}-${{ hashFiles('bun.lock') }}

      - name: Install browser dependencies
        if: matrix.project != 'chrome'
        run: bunx --bun playwright install-deps ${{ matrix.project }}

      - name: Verify system Chrome
        if: matrix.project == 'chrome'
        run: google-chrome --version

      - name: Install browser
        if: matrix.project != 'chrome' && steps.playwright-browsers.outputs.cache-hit != 'true'
        run: bunx --bun playwright install --no-remove ${{ matrix.project }}

      - name: Browser tests
        run: bunx --bun playwright test --project ${{ matrix.project }}
